apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - ../../base
  - secret.yaml

patches:
  - path: imagepullsecrets-patch.yaml
    target:
      kind: Deployment
      name: cloudflare-switchover

images:
  - name: ghcr.io/nicolastobias/cloudflare-switchover
    newTag: latest

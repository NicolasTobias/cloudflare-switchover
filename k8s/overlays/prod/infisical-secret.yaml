# Creado a mano hasta el 2026-10-22; ahora sale de Infisical (/cloudflare-switchover y /ghcr).
# Token de Cloudflare y del Alertmanager (ALERTMANAGER_TOKEN) del switchover, y su pull secret.
# Pull secret de ghcr.io (imagenes privadas de NicolasTobias). Es el mismo en
# todos los namespaces: una sola clave en Infisical, /ghcr DOCKERCONFIGJSON.
#
# PASO MANUAL al reconstruir: el Secret infisical-auth-credentials tiene que
# existir en monitoring (docs/recuperacion/MANUAL.md, fase E).
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: cloudflare-switchover-secret-infisical
  namespace: monitoring
spec:
  hostAPI: http://infisical-infisical-standalone-infisical.security.svc.cluster.local:8080
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-auth-credentials
        secretNamespace: monitoring
      secretsScope:
        projectSlug: "arenero-lw-vv"
        envSlug: "prod"
        secretsPath: "/cloudflare-switchover"
        recursive: false
  managedSecretReference:
    secretName: cloudflare-switchover-secret
    secretNamespace: monitoring
    secretType: Opaque
    creationPolicy: Owner
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: ghcr-cred-infisical
  namespace: monitoring
spec:
  hostAPI: http://infisical-infisical-standalone-infisical.security.svc.cluster.local:8080
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-auth-credentials
        secretNamespace: monitoring
      secretsScope:
        projectSlug: "arenero-lw-vv"
        envSlug: "prod"
        secretsPath: "/ghcr"
        recursive: false
  managedSecretReference:
    secretName: ghcr-cred
    secretNamespace: monitoring
    secretType: kubernetes.io/dockerconfigjson
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        ".dockerconfigjson": "{{ .DOCKERCONFIGJSON.Value }}"

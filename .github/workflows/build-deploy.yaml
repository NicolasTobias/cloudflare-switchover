name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/build-deploy.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        id: repo
        run: echo "repository=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Checkout deploy repo (arenero)
        uses: actions/checkout@v4
        with:
          repository: NicolasTobias/arenero
          token: ${{ secrets.ARENERO_DEPLOY_TOKEN }}
          path: arenero

      - name: Sync K8s manifests to deploy repo
        run: |
          # Create target directory if it doesn't exist
          mkdir -p arenero/cloudflare-switchover/k8s

          # Copy base/ entirely
          rm -rf arenero/cloudflare-switchover/k8s/base
          cp -r k8s/base arenero/cloudflare-switchover/k8s/base

          # Copy overlays entirely (kustomize edit set image will update image tag after)
          rm -rf arenero/cloudflare-switchover/k8s/overlays
          cp -r k8s/overlays arenero/cloudflare-switchover/k8s/overlays

      - name: Update Kustomization with new image tag
        run: |
          cd arenero/cloudflare-switchover/k8s/overlays/prod

          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          kustomize edit set image \
            ghcr.io/nicolastobias/cloudflare-switchover=ghcr.io/${REPO_LOWER}:${SHORT_SHA}

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if grep -q "app.kubernetes.io/deployed-at" kustomization.yaml; then
            sed -i "s/app.kubernetes.io\/deployed-at:.*/app.kubernetes.io\/deployed-at: \"$TIMESTAMP\"/" kustomization.yaml
          else
            if grep -q "commonAnnotations:" kustomization.yaml; then
              sed -i "/commonAnnotations:/a\  app.kubernetes.io/deployed-at: \"$TIMESTAMP\"" kustomization.yaml
            else
              echo "" >> kustomization.yaml
              echo "commonAnnotations:" >> kustomization.yaml
              echo "  app.kubernetes.io/deployed-at: \"$TIMESTAMP\"" >> kustomization.yaml
            fi
          fi

      - name: Commit and push to deploy repo
        run: |
          cd arenero
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add cloudflare-switchover/k8s/
          git diff --staged --quiet || (git commit -m "deploy(cloudflare-switchover): ${GITHUB_SHA::7}" && git push)

      - name: Summary
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "### Cloudflare Switchover Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${REPO_LOWER}:$(echo ${{ github.sha }} | cut -c1-7)\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Kustomization updated in **arenero** repo." >> $GITHUB_STEP_SUMMARY
          echo "ArgoCD will detect the change and sync automatically." >> $GITHUB_STEP_SUMMARY
